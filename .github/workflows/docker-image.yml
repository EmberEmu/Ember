name: Docker Image CI

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Docker Cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: /tmp/docker-cache
          key: docker-cache-${{ runner.os }}-${{ hashFiles('Dockerfile') }}
          restore-keys: docker-cache-${{ runner.os }}

      - name: Build the Docker image
        run: |
          docker buildx create --use --name mybuilder || docker buildx use mybuilder
          docker buildx build \
            --load \
            --file Dockerfile \
            --build-arg SKIP_UPGRADE \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            .

  build-shared:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Docker Cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: /tmp/docker-cache
          key: docker-cache-${{ runner.os }}-${{ hashFiles('Dockerfile') }}
          restore-keys: docker-cache-${{ runner.os }}

      - name: Build the Docker image
        run: |
          docker buildx create --use --name mybuilder || docker buildx use mybuilder
          docker buildx build \
            --load \
            --file Dockerfile \
            --build-arg SKIP_UPGRADE \
            --build-arg build_shared_libs=true \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            .
